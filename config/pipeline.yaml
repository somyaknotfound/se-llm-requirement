# Pipeline configuration. Every value here is a reproducibility claim — if you
# change one, the outputs/ directory is stale and must be regenerated wholesale.

paths:
  corpus_raw: corpus/raw
  corpus_processed: corpus/processed
  manifest: corpus/MANIFEST.csv
  chunks: corpus/chunks.jsonl
  index_dir: corpus/index
  outputs: outputs
  logs: logs/llm_calls.jsonl
  figures: figures

chunking:
  target_tokens: 800
  overlap_tokens: 120
  tokenizer: cl100k_base       # proxy tokenizer; documented as such in the report
  split_on_headings: true
  min_chunk_tokens: 60         # drop fragments below this — they are heading noise

retrieval:
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  # Inner product over L2-normalised vectors == cosine similarity, and ranks
  # identically to flat L2. Chosen over flat_l2 only so the score is a bounded,
  # reportable number instead of an unbounded distance.
  index_type: flat_ip
  top_k: 16
  normalize_embeddings: true
  # Hard ceiling on retrieved context. num_ctx must hold prompt + response, so
  # top_k alone is not a safe budget: 16 x 800 tokens would overflow the window
  # and silently truncate the evidence the model is meant to cite.
  max_context_tokens: 7000

  # Retrieval strategy: `single` embeds one query built from the functionality
  # description plus the whole keyword list; `faceted` embeds one query per facet
  # below and interleaves the results round-robin.
  #
  # `single` was measured and rejected. One centroid vector over 26 mixed keywords
  # lands in the controlled-substance region, where D06 alone holds 45 chunks, and
  # returns evidence from only D05 and D06 — leaving allergy checking, access
  # control and audit ungrounded even though the corpus documents all three. That
  # is a retrieval artifact, not a property of the corpus, and reporting it as a
  # finding would be reporting a bug. Both modes are kept so the report can show
  # the comparison; §Threats to Validity discusses the residual bias.
  strategy: faceted
  per_facet: 3
  facets:
    - id: order_content
      query: >-
        Structure and required data elements of a medication order or
        prescription resource: medication, dosage instruction, route, quantity,
        prescriber, subject, authored date, substitution and refill authorisation.
    - id: allergy_interaction
      query: >-
        Recording patient allergies and intolerances, and checking drug-drug
        interaction and contraindication alerts through clinical decision support
        at the point of computerised provider order entry.
    - id: security_audit
      query: >-
        Audit logging, provenance, digital signature, access control and
        authorisation for clinical records, including recording who accessed or
        modified data and when.
    - id: hipaa_safeguards
      query: >-
        Administrative, physical and technical safeguards for electronic
        protected health information: access control, audit controls, integrity,
        person authentication, transmission security and risk analysis.
    - id: controlled_substance
      query: >-
        Electronic prescriptions for controlled substances: identity proofing,
        two-factor authentication, hard tokens, digital certificates, signing and
        practitioner responsibilities.
    - id: certification_criteria
      query: >-
        Health IT certification criteria for electronic prescribing, computerised
        provider order entry for medications, drug formulary checks and audit
        report generation.
    - id: lifecycle_transmission
      query: >-
        Transmitting a prescription to a pharmacy, and cancelling, changing,
        renewing or refilling a prescription, including record retention.

# --- The functionality under analysis ------------------------------------
# Chosen for NFR density: safety, auditability, consent, latency and regulatory
# constraints all bind on this one feature. A CRUD feature like "patient login"
# would not exercise the requirement-classification surface.
target:
  id: e-prescription
  name: Electronic Prescription (e-Rx) Issuance
  description: >-
    Issuance of an electronic prescription by an authorised prescriber, including
    real-time drug-drug interaction and allergy contraindication checking at the
    point of ordering, and the additional identity-proofing, two-factor signing and
    audit obligations that attach to controlled-substance prescriptions before the
    order is transmitted to a pharmacy.

  # Query expansion for retrieval. The raw description alone under-retrieves —
  # source documents use regulatory vocabulary, not feature vocabulary.
  keywords:
    - electronic prescribing
    - e-prescribing
    - computerised provider order entry
    - CPOE
    - MedicationRequest
    - medication order
    - drug-drug interaction check
    - drug interaction alert
    - allergy intolerance
    - contraindication
    - clinical decision support
    - controlled substance
    - EPCS
    - two-factor authentication
    - identity proofing
    - electronic signature
    - prescriber authentication
    - audit log
    - audit trail
    - provenance
    - access control
    - patient consent
    - transmission to pharmacy
    - medication reconciliation
    - formulary
    - dosage
    - prescription cancellation

generation:
  min_requirements: 18
  max_requirements: 25
  min_nfrs: 8
  # An FR floor as well as an NFR floor. The first run returned 2 FRs and 11 NFRs:
  # asking only for "at least 8 NFRs" steers a small model into expressing the whole
  # feature as quality attributes, which leaves the SDLC input in Part 2 with almost
  # no functional surface to reason about.
  min_frs: 8
  min_traceability_rate: 0.70   # fraction citing >=1 real chunk_id
  # Part 1's two calls override the model defaults: 25 requirements with reasoning
  # approach 6k output tokens, and the repair prompt carries the evidence AND the
  # previous response. qwen2.5 supports a 32k window natively.
  num_ctx: 32768
  num_predict: 8192

sdlc:
  framings: [neutral, agile_primed, plan_primed]
  trials: 3
  models: [primary, secondary]  # 3 x 3 x 2 = 18 data points
  # The decision factors, MCDA profiles, rules and workflow templates live in
  # config/sdlc.yaml — the brief's 13 factors replaced the original 8 criteria.

# Knowledge-base version. Every run manifest records it with the corpus manifest
# hash, config/controls.yaml and config/sdlc.yaml versions, and the model digests.
kb_version: "2026-09-28"

# --- Multi-agent system ----------------------------------------------------
agents:
  # The system runs on the primary model; simulated stakeholders are played by the
  # secondary model so the system is never interviewing itself.
  model: primary
  persona_model: secondary
  interview_rounds: 2           # questions, then follow-ups on vague or incomplete answers
  questions_per_role: 6
  clarification_rounds: 2       # bounded loop for requirements that fail quality checks
  batch_size: 6                 # requirements per call for classification, risk, stories
  evidence_tokens: 2500         # retrieved-evidence budget per extraction call
  threats: 8                    # STRIDE threats the security agent is asked for
  use_cases: 4
  duplicate_similarity: 0.86    # embedding cosine at or above which a pair is a duplicate candidate
  conflict_similarity: 0.55     # same-subject threshold for conflict candidates
  max_conflict_pairs: 24
  critic: true                  # LLM critic on the final set (one call per requirement)

  # Least-privilege permissions, enforced by the blackboard. `retrieval` is the
  # knowledge-source allowlist: `case` = the case's knowledge_sources, [] = none.
  permissions:
    stakeholder_interaction:
      reads: [statements, interview_log]
      writes: [statements, interview_log]
      retrieval: []
    extraction:
      reads: [statements, requirements, requirement_history]
      writes: [requirements, requirement_history]
      retrieval: case
    conflict_detection:
      reads: [requirements, statements, requirement_history, conflicts, findings]
      writes: [requirements, requirement_history, conflicts, findings]
      retrieval: []
    clarification:
      reads: [requirements, findings, conflicts, statements, clarifications]
      writes: [clarifications, statements, findings]
      retrieval: []
    classification:
      reads: [requirements]
      writes: [requirements]
      retrieval: []
    compliance:
      reads: [requirements, compliance, gaps, findings]
      writes: [compliance, gaps, requirements, findings]
      retrieval: case
    security_privacy:
      reads: [requirements, compliance, threats]
      writes: [threats, requirements]
      retrieval: case
    risk_analysis:
      reads: [requirements, threats, compliance, risks]
      writes: [risks, requirements]
      retrieval: []
    validation:
      reads: [requirements, statements, findings, conflicts, compliance, validation,
              confidence, hallucination]
      writes: [validation, confidence, findings, hallucination, requirements]
      retrieval: []
    sdlc_selection:
      reads: [requirements, risks, compliance, threats, sdlc]
      writes: [sdlc]
      retrieval: []
    documentation:
      reads: [requirements, statements, compliance, gaps, risks, threats, findings, conflicts,
              confidence, sdlc, clarifications, validation, hallucination, artifacts,
              requirement_history, security_events, approvals, out_of_scope]
      writes: [artifacts]
      retrieval: []
    human_approval:
      reads: [requirements, confidence, findings, compliance, threats, sdlc, conflicts,
              security_events, risks, approvals]
      writes: [approvals]
      retrieval: []

evaluation:
  # A generated requirement matches a gold requirement at or above this cosine
  # similarity (all-MiniLM-L6-v2). Fixed before any results existed; matches are
  # written out for human verification, which replaces the automatic count.
  match_threshold: 0.6

# Multi-label requirement categories (brief point 9).
categories:
  - business
  - stakeholder
  - functional
  - security
  - privacy
  - regulatory
  - performance
  - availability_reliability
  - usability
  - data_management
  - integration
  - audit_reporting
  - operational

validation:
  # Requirements scoring below this confidence are escalated for human review.
  confidence_threshold: 0.7
  # Defined terms for the undefined-terminology check (brief point 10): an acronym
  # a requirement uses that is not listed here is flagged for clarification.
  glossary: [API, ATNA, CDS, CFR, CPOE, CSOS, CSV, DAST, DEA, EHR, EPCS, ePHI, FHIR,
             FIPS, HHS, HIPAA, HL7, HTTP, HTTPS, IAL, ID, IHE, IT, JSON, KB, MFA, MLLP,
             MRN, NCPDP, NIST, NPI, OAuth, OIDC, ONC, OTP, PDF, PHI, PIN, RBAC, ABAC,
             REST, RTM, SAST, SCRIPT, SLA, SMART, SQL, SRS, SSO, TLS, UI, UX, XML, US,
             "2FA", "A/B", "P&T", "4G", GPS, iOS, OS, URL, UTC, IR]
  attributes:
    - necessary
    - unambiguous
    - complete
    - singular
    - feasible
    - verifiable
    - conforming
    - traceable
  weak_words:
    - fast
    - quick
    - quickly
    - user-friendly
    - efficient
    - efficiently
    - appropriate
    - appropriately
    - as needed
    - as required
    - adequate
    - adequately
    - sufficient
    - sufficiently
    - reasonable
    - robust
    - flexible
    - seamless
    - intuitive
    - easy
    - easily
    - minimal
    - optimal
    - state-of-the-art
    - support
    - handle
    - process
    - manage
    - etc
    - and/or
    - if possible
    - where applicable
    - as appropriate
    - timely
    - relevant
    - various
    - several
    - normal
    - typical
